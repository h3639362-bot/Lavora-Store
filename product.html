<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAVORA STORE</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .top-bar {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #b99535;
    }

    .brand-logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      display: block;
      margin: 0 auto 12px;
    }

    .top-bar a {
      color: #d4af37;
      text-decoration: none;
      font-size: 14px;
    }

    .details {
      max-width: 950px;
      margin: 55px auto;
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 45px;
    }

    .image-box {
      background: #151515;
      border: 1px solid #39301b;
      border-radius: 18px;
      padding: 20px;
    }

    .details img.product-image {
      width: 100%;
      max-width: 330px;
      display: block;
      border-radius: 12px;
      object-fit: contain;
    }

    .info {
      flex: 1;
      min-width: 260px;
    }

    .info h1 {
      color: #d4af37;
      font-size: 32px;
      margin-bottom: 15px;
    }

    .description {
      color: #aaa;
      line-height: 1.9;
    }

    .gold-line {
      width: 65px;
      height: 3px;
      background: #d4af37;
      margin: 20px 0;
    }

    .size-select,
    .quantity-input {
      display: block;
      width: 100%;
      max-width: 280px;
      padding: 14px;
      margin: 12px 0 22px;
      border-radius: 9px;
      background: #181818;
      color: white;
      border: 1px solid #8c702b;
      font-size: 16px;
      box-sizing: border-box;
    }

    .order-btn {
      display: block;
      width: fit-content;
      margin-top: 25px;
      padding: 15px 30px;
      background: linear-gradient(135deg, #f3d477, #b18a27);
      color: #111;
      text-decoration: none;
      border-radius: 9px;
      font-weight: bold;
      transition: 0.3s;
    }

    .order-btn:hover {
      transform: translateY(-3px);
    }

    .back-btn {
      display: inline-block;
      margin-top: 20px;
      color: #d4af37;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      border-top: 1px solid #292318;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .details {
        margin: 20px auto;
        padding: 18px;
        gap: 25px;
      }

      .info h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <header class="top-bar">
    <img
      src="images/logo.png"
      alt="LAVORA STORE"
      class="brand-logo"
    >

    <a href="index.html">العودة إلى المتجر ←</a>
  </header>

  <main class="details">

    <div class="image-box">
      <img
        id="productImage"
        class="product-image"
        src=""
        alt="صورة البرفان"
      >
    </div>

    <div class="info">
      <h1 id="productName">اسم البرفان</h1>

      <div class="gold-line"></div>

      <p class="description">
        اكتشف عطرك المميز مع LAVORA STORE.
        اختار الحجم والكمية المناسبة ليك واطلب بسهولة.
      </p>

      <div id="sizeArea"></div>

      <label for="quantity">الكمية:</label>

      <input
        type="number"
        id="quantity"
        class="quantity-input"
        min="1"
        step="1"
        value="1"
      >

      <a
        id="orderButton"
        class="order-btn"
        href="#"
        target="_blank"
        rel="noopener"
      >
        اطلب الآن عبر واتساب
      </a>

      <a class="back-btn" href="index.html">
        ← العودة لكل المنتجات
      </a>
    </div>

  </main>

  <footer>
    © 2026 LAVORA STORE - All Rights Reserved
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);

    const name = params.get("name") || "برفان من لافورا";
    const image = params.get("image");

    document.getElementById("productName").textContent = name;
    document.title = name + " | LAVORA STORE";

    if (image) {
      document.getElementById("productImage").src = image;
    }

    const sizeArea = document.getElementById("sizeArea");
    let sizes = [];

    if (name.toLowerCase().startsWith("tobacco")) {
      sizes = ["20 مل", "50 مل", "100 مل"];
    } else if (name.toLowerCase().startsWith("signature")) {
      sizes = ["100 مل"];
    } else if (name.toLowerCase() === "queen") {
      sizes = ["50 مل", "100 مل"];
    }

    if (sizes.length > 0) {
      sizeArea.innerHTML = `
        <label for="sizeSelect">اختار الحجم:</label>

        <select id="sizeSelect" class="size-select">
          ${sizes.map(size =>
            `<option value="${size}">${size}</option>`
          ).join("")}
        </select>
      `;
    } else {
      sizeArea.textContent = "الأحجام سيتم تحديدها لاحقًا";
    }

    function updateWhatsApp() {
      const selectedSize = document.getElementById("sizeSelect");

      const sizeText = selectedSize
        ? selectedSize.value
        : "لم يتم تحديد الحجم";

      const quantityInput = document.getElementById("quantity");

      const quantity = Math.max(
        1,
        Math.floor(Number(quantityInput.value) || 1)
      );

      quantityInput.value = quantity;

      const message =
        "السلام عليكم، عايز أطلب " + name +
        " بحجم " + sizeText +
        " والكمية " + quantity +
        " من LAVORA STORE";

      const phone = "201037522814";

      const link =
        "https://wa.me/" + phone +
        "?text=" + encodeURIComponent(message);

      document.getElementById("orderButton").href = link;
    }

    document
      .getElementById("quantity")
      .addEventListener("input", updateWhatsApp);

    if (sizes.length > 0) {
      document
        .getElementById("sizeSelect")
        .addEventListener("change", updateWhatsApp);
    }

    updateWhatsApp();
  </script>

</body>
</html>
